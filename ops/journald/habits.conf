# Drop-in for systemd-journald, installed on the server as /etc/systemd/journald.conf.d/habits.conf (FR-032).
# Every service of compose.prod.yaml logs to the journal, so this is the whole log retention: 7 days, in files of
# one day, so a day's logs leave together.
[Journal]
MaxRetentionSec=7day
MaxFileSec=1day
