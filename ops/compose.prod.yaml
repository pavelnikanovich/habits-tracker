# Production (research R13): Caddy as the only entry point, PostgreSQL and the application from the GHCR image. Lives on
# the server in /opt/habits next to ops/Caddyfile (as ./Caddyfile) and the .env of ops/.env.example, which names the
# secrets; none is in the repository. Every service logs to the journal, so the retention of
# ops/journald/habits.conf covers all logs (FR-032). A deployment recreates `app` only: caddy keeps its certificates
# in caddy_data.
services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-habits.cardlane.eu}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - edge
    logging:
      driver: journald

  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: habits
      POSTGRES_USER: habits
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "habits", "--dbname", "habits"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - edge
    logging:
      driver: journald

  app:
    image: ghcr.io/${IMAGE_OWNER:?set IMAGE_OWNER in .env}/habits-tracker:${IMAGE_TAG:?set IMAGE_TAG, the commit SHA}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Habits: Host=db;Database=habits;Username=habits;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      Identity__CodeHashKey: ${IDENTITY_CODE_HASH_KEY:?set IDENTITY_CODE_HASH_KEY in .env}
      Resend__ApiKey: ${RESEND_API_KEY:?set RESEND_API_KEY in .env}
      ForwardedHeaders__KnownNetwork: 172.30.0.0/24
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
    logging:
      driver: journald

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
  db-data:
