# The availability check (FR-038, research R16): every 5 minutes, the shortest interval GitHub allows. A timeout, a TLS
# error or a non-success status fails the run, and GitHub notifies the developer of a failed scheduled run.
# ops/availability-month.sh counts the runs of a month. Schedules run only from the default branch.
name: Availability

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: curl --fail --silent --show-error --max-time 10 https://habits.cardlane.eu/health
