# Deploys a pull request's branch when the developer adds the label `deploy` (FR-034, research R13). Only branches of
# this repository: a fork's pull request gets no secrets, and its code is never deployed.
name: Deploy branch

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.label.name == 'deploy' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
